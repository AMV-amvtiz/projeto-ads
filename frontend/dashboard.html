<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amvtiz Soluções</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <h1>Amvtiz</h1>
                <p>Soluções</p>
            </div>

            <div>
                <span>Olá, usuário</span>
                <button type="button" onclick="sair()">Sair</button>
            </div>
        </header>

        <section class="dashboard-content">

            <h2>Painel Inicial</h2>
            <p>Boas-vindas ao sistema.</p>

            <div id="acaoVendedor" style="display: none; margin-top: 30px;">
                <button type="button" onclick="novaSolicitacao()">
                    Nova Solicitação de Medição
                </button>
            </div>

            <div id="menuAdmin" style="display: none; margin-top: 30px;">
                <button type="button" onclick="mostrarSolicitacoes()">
                    Solicitações
                </button>

                <button type="button" onclick="mostrarUsuarios()">
                    Usuários
                </button>
            </div>

            <div id="areaSolicitacoes" style="margin-top: 30px;">

                <h2>Solicitações</h2>

                <div id="listaSolicitacoes"></div>

            </div>

            <div id="areaAdmin" style="display: none; margin-top: 30px;">

                <h2>Usuários</h2>

                <div id="usuariosPendentes"></div>

            </div>

        </section>

    </main>

    <script>
        const usuario = JSON.parse(localStorage.getItem('usuario'));

        if (!usuario) {
            window.location.href = 'index.html';
        }

        if (usuario) {

            document.querySelector('.dashboard-header span').textContent =
                `Olá, ${usuario.nome}`;

            carregarSolicitacoes();

            if (usuario.perfil === 'VENDEDOR') {
                document.getElementById('acaoVendedor').style.display = 'block';
            }

            if (usuario.perfil === 'ADMIN') {
                document.getElementById('menuAdmin').style.display = 'block';
                carregarUsuarios();
                mostrarSolicitacoes();
            }
        }

        async function carregarSolicitacoes() {

            let url = '/pedidos';

            if (usuario.perfil === 'VENDEDOR') {
                url = `/pedidos?usuario_id=${usuario.id}`;
            }

            try {

                const resposta = await fetch(url);
                const solicitacoes = await resposta.json();

                const container =
                    document.getElementById('listaSolicitacoes');

                container.innerHTML = '';

                if (!resposta.ok) {
                    container.textContent =
                        'Erro ao carregar solicitações.';
                    return;
                }

                if (solicitacoes.length === 0) {
                    container.textContent =
                        'Não há solicitações cadastradas.';
                    return;
                }

                solicitacoes.forEach(solicitacao => {

                    const div = document.createElement('div');

                    div.innerHTML = `
                        <p>
                            <strong>Pedido:</strong>
                            ${solicitacao.numero_pedido}
                        </p>

                        <p>
                            <strong>Cliente:</strong>
                            ${solicitacao.cliente}
                            <br>

                            <strong>Obra:</strong>
                            ${solicitacao.obra}
                            <br>

                            <strong>Endereço:</strong>
                            ${solicitacao.endereco}
                            <br>

                            <strong>Tipo de Serviço:</strong>
                            ${solicitacao.tipo_servico}
                            <br>

                            <strong>Solicitado por:</strong>
                            ${solicitacao.solicitado_por}
                        </p>

                        ${
                            solicitacao.observacoes
                                ? `
                                    <p>
                                        <strong>Observações:</strong>
                                        ${solicitacao.observacoes}
                                    </p>
                                `
                                : ''
                        }

                        <hr>
                    `;

                    container.appendChild(div);
                });

            } catch (error) {

                document.getElementById('listaSolicitacoes').textContent =
                    'Erro ao carregar solicitações.';
            }
        }

        function carregarUsuarios() {

            fetch('/usuarios')
                .then(resposta => resposta.json())
                .then(usuarios => {

                    const container =
                        document.getElementById('usuariosPendentes');

                    container.innerHTML = '';

                    if (usuarios.length === 0) {
                        container.textContent =
                            'Não há usuários.';
                        return;
                    }

                    usuarios.forEach(usuarioPendente => {

                        const div = document.createElement('div');

                        div.id = `usuario-${usuarioPendente.id}`;

                        if (usuarioPendente.status === 'PENDENTE') {

                            div.innerHTML = `
                                <p>
                                    <strong>${usuarioPendente.nome}</strong>
                                    - ${usuarioPendente.email}
                                </p>

                                <p>
                                    Status: <strong>PENDENTE</strong>
                                </p>

                                <select id="perfil-${usuarioPendente.id}">
                                    <option value="">Selecione o perfil</option>
                                    <option value="ADMIN">ADMIN</option>
                                    <option value="GERENTE">GERENTE</option>
                                    <option value="VENDEDOR">VENDEDOR</option>
                                    <option value="TECNICO">TECNICO</option>
                                </select>

                                <button onclick="aprovarUsuario(${usuarioPendente.id})">
                                    Aprovar
                                </button>

                                <hr>
                            `;

                        } else {

                            div.innerHTML = `
                                <p>
                                    <strong>${usuarioPendente.nome}</strong>
                                    - ${usuarioPendente.email}
                                </p>

                                <p>
                                    Perfil: <strong>${usuarioPendente.perfil}</strong>
                                    <br>
                                    Status: <strong>${usuarioPendente.status}</strong>
                                </p>

                                <hr>
                            `;
                        }

                        container.appendChild(div);
                    });
                });
        }

        function mostrarSolicitacoes() {
            document.getElementById('areaSolicitacoes').style.display = 'block';
            document.getElementById('areaAdmin').style.display = 'none';
        }

        function mostrarUsuarios() {
            document.getElementById('areaSolicitacoes').style.display = 'none';
            document.getElementById('areaAdmin').style.display = 'block';
        }

        async function aprovarUsuario(id) {

            const perfil =
                document.getElementById(`perfil-${id}`).value;

            if (!perfil) {
                alert('Selecione um perfil.');
                return;
            }

            const resposta = await fetch(
                `/usuarios/${id}/aprovar`,
                {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        perfil: perfil
                    })
                }
            );

            const dados = await resposta.json();

            if (resposta.ok) {

                const usuarioDiv =
                    document.getElementById(`usuario-${id}`);

                usuarioDiv.innerHTML = `
                    <p>
                        <strong>${dados.nome}</strong>
                        - ${dados.email}
                    </p>

                    <p>
                        Perfil: <strong>${dados.perfil}</strong>
                        <br>
                        Status: <strong>${dados.status}</strong>
                    </p>

                    <hr>
                `;

            } else {

                alert(dados.erro);
            }
        }

        function novaSolicitacao() {
            window.location.href = 'solicitacao.html';
        }

        function sair() {
            localStorage.removeItem('usuario');
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
