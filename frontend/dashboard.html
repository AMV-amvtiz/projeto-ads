<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amvtiz Soluções</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <h1>Amvtiz</h1>
                <p>Soluções</p>
            </div>

            <div>
                <span>Olá, usuário</span>
                <button type="button" onclick="sair()">Sair</button>
            </div>
        </header>

        <section class="dashboard-content">

            <h2>Painel Inicial</h2>
            <p>Boas-vindas ao sistema.</p>

            <div id="acaoVendedor" style="display: none; margin-top: 30px;">
                <button type="button" onclick="novaSolicitacao()">
                    Nova Solicitação de Medição
                </button>
            </div>

            <div id="menuAdmin" style="display: none; margin-top: 30px;">
                <button type="button" onclick="mostrarSolicitacoes()">
                    Solicitações
                </button>

                <button type="button" onclick="mostrarUsuarios()">
                    Usuários
                </button>
            </div>

            <div id="areaSolicitacoes" style="margin-top: 30px;">

                <h2 id="tituloSolicitacoes">Solicitações</h2>

                <div id="listaSolicitacoes"></div>

            </div>

            <div id="areaAdmin" style="display: none; margin-top: 30px;">

                <h2>Usuários</h2>

                <div id="usuariosPendentes"></div>

            </div>

        </section>

    </main>

    <script>
        const usuario = JSON.parse(localStorage.getItem('usuario'));

        let tecnicos = [];

        if (!usuario) {
            window.location.href = 'index.html';
        }

        if (usuario) {

            document.querySelector('.dashboard-header span').textContent =
                `Olá, ${usuario.nome}`;

            if (usuario.perfil === 'VENDEDOR') {
                document.getElementById('acaoVendedor').style.display = 'block';
            }

            if (usuario.perfil === 'ADMIN') {
                document.getElementById('menuAdmin').style.display = 'block';
                carregarUsuarios();
                mostrarSolicitacoes();
            }

            if (usuario.perfil === 'TECNICO') {
                document.getElementById('tituloSolicitacoes').textContent =
                    'Meus Agendamentos';
            }

            iniciarDashboard();
        }

        function formatarData(dataRecebida) {

            if (!dataRecebida) {
                return '';
            }

            const data = new Date(dataRecebida);

            const dataFormatada = data.toLocaleDateString(
                'pt-BR',
                {
                    timeZone: 'UTC'
                }
            );

            const diasSemana = [
                'dom',
                'seg',
                'ter',
                'qua',
                'qui',
                'sex',
                'sáb'
            ];

            const diaSemana =
                diasSemana[data.getUTCDay()];

            return `${dataFormatada} (${diaSemana})`;
        }

        async function iniciarDashboard() {

            if (
                usuario.perfil === 'ADMIN' ||
                usuario.perfil === 'GERENTE'
            ) {
                await carregarTecnicos();
            }

            if (usuario.perfil === 'TECNICO') {
                await carregarAgendamentosTecnico();
            } else {
                await carregarSolicitacoes();
            }
        }

        async function carregarTecnicos() {

            try {

                const resposta = await fetch('/tecnicos');

                if (!resposta.ok) {
                    tecnicos = [];
                    return;
                }

                tecnicos = await resposta.json();

            } catch (error) {

                tecnicos = [];
            }
        }

        async function carregarAgendamentosTecnico() {

            const container =
                document.getElementById('listaSolicitacoes');

            container.innerHTML = '';

            try {

                const resposta = await fetch(
                    `/agendamentos?tecnico_id=${usuario.id}`
                );

                const agendamentos = await resposta.json();

                if (!resposta.ok) {
                    container.textContent =
                        'Erro ao carregar agendamentos.';
                    return;
                }

                if (agendamentos.length === 0) {
                    container.textContent =
                        'Não há agendamentos atribuídos a você.';
                    return;
                }

                agendamentos.forEach(agendamento => {

                    const card = document.createElement('div');

                    card.className = 'solicitacao-card';

                    const dataSolicitacao =
                        agendamento.data_solicitacao
                            ? `
                                <p>
                                    <strong>Solicitado em:</strong>
                                    ${formatarData(
                                        agendamento.data_solicitacao
                                    )}
                                </p>
                            `
                            : '';

                    const hora =
                        agendamento.hora_agendamento.substring(0, 5);

                    card.innerHTML = `
                        <div class="bloco-solicitacao">

                            <h3>Solicitação</h3>

                            <p>
                                <strong>Pedido:</strong>
                                ${agendamento.numero_pedido}
                            </p>

                            <p>
                                <strong>Cliente:</strong>
                                ${agendamento.cliente}
                            </p>

                            <p>
                                <strong>Obra:</strong>
                                ${agendamento.obra}
                            </p>

                            <p>
                                <strong>Endereço:</strong>
                                ${agendamento.endereco}
                            </p>

                            <p>
                                <strong>Tipo de Serviço:</strong>
                                ${agendamento.tipo_servico}
                            </p>

                            <p>
                                <strong>Solicitado por:</strong>
                                ${agendamento.solicitado_por}
                            </p>

                            ${dataSolicitacao}

                            ${
                                agendamento.observacoes
                                    ? `
                                        <p>
                                            <strong>Observações:</strong>
                                            ${agendamento.observacoes}
                                        </p>
                                    `
                                    : ''
                            }

                        </div>

                        <div class="bloco-agendamento">

                            <h3>Agendamento</h3>

                            <p>
                                <strong>Data:</strong>
                                ${formatarData(
                                    agendamento.data_agendamento
                                )}
                            </p>

                            <p>
                                <strong>Hora:</strong>
                                ${hora}
                            </p>

                            <p>
                                <strong>Técnico:</strong>
                                ${agendamento.tecnico}
                            </p>

                            <p>
                                <strong>Status:</strong>
                                ${agendamento.status}
                            </p>

                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {

                container.textContent =
                    'Erro ao carregar agendamentos.';
            }
        }

        async function carregarSolicitacoes() {

            let url = '/pedidos';

            if (usuario.perfil === 'VENDEDOR') {
                url = `/pedidos?usuario_id=${usuario.id}`;
            }

            try {

                const resposta = await fetch(url);
                const solicitacoes = await resposta.json();

                const container =
                    document.getElementById('listaSolicitacoes');

                container.innerHTML = '';

                if (!resposta.ok) {
                    container.textContent =
                        'Erro ao carregar solicitações.';
                    return;
                }

                if (solicitacoes.length === 0) {
                    container.textContent =
                        'Não há solicitações cadastradas.';
                    return;
                }

                solicitacoes.forEach(solicitacao => {

                    const card = document.createElement('div');

                    card.className = 'solicitacao-card';

                    let areaAgendamento = '';

                    if (solicitacao.agendamento_id) {

                        const dataAgendamento =
                            formatarData(
                                solicitacao.data_agendamento
                            );

                        const hora =
                            solicitacao.hora_agendamento.substring(0, 5);

                        areaAgendamento = `
                            <div class="bloco-agendamento">

                                <h3>Agendamento</h3>

                                <p>
                                    <strong>Data:</strong>
                                    ${dataAgendamento}
                                </p>

                                <p>
                                    <strong>Hora:</strong>
                                    ${hora}
                                </p>

                                <p>
                                    <strong>Técnico:</strong>
                                    ${solicitacao.tecnico || 'Não informado'}
                                </p>

                                <p>
                                    <strong>Status:</strong>
                                    ${solicitacao.status_agendamento}
                                </p>

                            </div>
                        `;

                    } else if (
                        usuario.perfil === 'ADMIN' ||
                        usuario.perfil === 'GERENTE'
                    ) {

                        const opcoesTecnicos = tecnicos
                            .map(tecnico => `
                                <option value="${tecnico.id}">
                                    ${tecnico.nome}
                                </option>
                            `)
                            .join('');

                        areaAgendamento = `
                            <div
                                class="bloco-agendamento"
                                id="agendamento-${solicitacao.id}"
                            >

                                <h3>Agendar Medição</h3>

                                <label for="tecnico-${solicitacao.id}">
                                    Técnico
                                </label>

                                <select id="tecnico-${solicitacao.id}">
                                    <option value="">
                                        Selecione o técnico
                                    </option>
                                    ${opcoesTecnicos}
                                </select>

                                <label for="data-${solicitacao.id}">
                                    Data
                                </label>

                                <input
                                    type="date"
                                    id="data-${solicitacao.id}"
                                >

                                <label for="hora-${solicitacao.id}">
                                    Hora
                                </label>

                                <input
                                    type="time"
                                    id="hora-${solicitacao.id}"
                                >

                                <button
                                    type="button"
                                    onclick="agendarMedicao(${solicitacao.id})"
                                >
                                    Agendar
                                </button>

                                <p
                                    class="mensagem-agendamento"
                                    id="mensagem-agendamento-${solicitacao.id}"
                                >
                                </p>

                            </div>
                        `;

                    } else {

                        areaAgendamento = `
                            <div class="bloco-agendamento">

                                <h3>Agendamento</h3>

                                <p>
                                    <strong>Status:</strong>
                                    AGUARDANDO AGENDAMENTO
                                </p>

                            </div>
                        `;
                    }

                    const dataSolicitacao =
                        solicitacao.data_solicitacao
                            ? `
                                <p>
                                    <strong>Solicitado em:</strong>
                                    ${formatarData(
                                        solicitacao.data_solicitacao
                                    )}
                                </p>
                            `
                            : '';

                    card.innerHTML = `
                        <div class="bloco-solicitacao">

                            <h3>Solicitação</h3>

                            <p>
                                <strong>Pedido:</strong>
                                ${solicitacao.numero_pedido}
                            </p>

                            <p>
                                <strong>Cliente:</strong>
                                ${solicitacao.cliente}
                            </p>

                            <p>
                                <strong>Obra:</strong>
                                ${solicitacao.obra}
                            </p>

                            <p>
                                <strong>Endereço:</strong>
                                ${solicitacao.endereco}
                            </p>

                            <p>
                                <strong>Tipo de Serviço:</strong>
                                ${solicitacao.tipo_servico}
                            </p>

                            <p>
                                <strong>Solicitado por:</strong>
                                ${solicitacao.solicitado_por}
                            </p>

                            ${dataSolicitacao}

                            ${
                                solicitacao.observacoes
                                    ? `
                                        <p>
                                            <strong>Observações:</strong>
                                            ${solicitacao.observacoes}
                                        </p>
                                    `
                                    : ''
                            }

                        </div>

                        ${areaAgendamento}
                    `;

                    container.appendChild(card);
                });

            } catch (error) {

                document.getElementById('listaSolicitacoes').textContent =
                    'Erro ao carregar solicitações.';
            }
        }

        async function agendarMedicao(pedidoId) {

            const tecnicoId =
                document.getElementById(`tecnico-${pedidoId}`).value;

            const data =
                document.getElementById(`data-${pedidoId}`).value;

            const hora =
                document.getElementById(`hora-${pedidoId}`).value;

            const mensagem =
                document.getElementById(
                    `mensagem-agendamento-${pedidoId}`
                );

            if (!tecnicoId || !data || !hora) {
                mensagem.textContent =
                    'Informe técnico, data e hora.';
                return;
            }

            try {

                const resposta = await fetch('/agendamentos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        pedido_id: pedidoId,
                        data_agendamento: data,
                        hora_agendamento: hora,
                        tecnico_id: Number(tecnicoId)
                    })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    mensagem.textContent = dados.erro;
                    return;
                }

                await carregarSolicitacoes();

            } catch (error) {

                mensagem.textContent =
                    'Erro ao realizar agendamento.';
            }
        }

        function carregarUsuarios() {

            fetch('/usuarios')
                .then(resposta => resposta.json())
                .then(usuarios => {

                    const container =
                        document.getElementById('usuariosPendentes');

                    container.innerHTML = '';

                    if (usuarios.length === 0) {
                        container.textContent =
                            'Não há usuários.';
                        return;
                    }

                    usuarios.forEach(usuarioPendente => {

                        const div = document.createElement('div');

                        div.id = `usuario-${usuarioPendente.id}`;

                        if (usuarioPendente.status === 'PENDENTE') {

                            div.innerHTML = `
                                <p>
                                    <strong>${usuarioPendente.nome}</strong>
                                    - ${usuarioPendente.email}
                                </p>

                                <p>
                                    Status: <strong>PENDENTE</strong>
                                </p>

                                <select id="perfil-${usuarioPendente.id}">
                                    <option value="">
                                        Selecione o perfil
                                    </option>
                                    <option value="ADMIN">ADMIN</option>
                                    <option value="GERENTE">GERENTE</option>
                                    <option value="VENDEDOR">VENDEDOR</option>
                                    <option value="TECNICO">TECNICO</option>
                                </select>

                                <button
                                    onclick="aprovarUsuario(${usuarioPendente.id})"
                                >
                                    Aprovar
                                </button>

                                <hr>
                            `;

                        } else {

                            div.innerHTML = `
                                <p>
                                    <strong>${usuarioPendente.nome}</strong>
                                    - ${usuarioPendente.email}
                                </p>

                                <p>
                                    Perfil:
                                    <strong>${usuarioPendente.perfil}</strong>
                                    <br>

                                    Status:
                                    <strong>${usuarioPendente.status}</strong>
                                </p>

                                <hr>
                            `;
                        }

                        container.appendChild(div);
                    });
                });
        }

        function mostrarSolicitacoes() {
            document.getElementById('areaSolicitacoes').style.display =
                'block';

            document.getElementById('areaAdmin').style.display =
                'none';
        }

        function mostrarUsuarios() {
            document.getElementById('areaSolicitacoes').style.display =
                'none';

            document.getElementById('areaAdmin').style.display =
                'block';
        }

        async function aprovarUsuario(id) {

            const perfil =
                document.getElementById(`perfil-${id}`).value;

            if (!perfil) {
                alert('Selecione um perfil.');
                return;
            }

            const resposta = await fetch(
                `/usuarios/${id}/aprovar`,
                {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        perfil: perfil
                    })
                }
            );

            const dados = await resposta.json();

            if (resposta.ok) {

                const usuarioDiv =
                    document.getElementById(`usuario-${id}`);

                usuarioDiv.innerHTML = `
                    <p>
                        <strong>${dados.nome}</strong>
                        - ${dados.email}
                    </p>

                    <p>
                        Perfil: <strong>${dados.perfil}</strong>
                        <br>
                        Status: <strong>${dados.status}</strong>
                    </p>

                    <hr>
                `;

            } else {

                alert(dados.erro);
            }
        }

        function novaSolicitacao() {
            window.location.href = 'solicitacao.html';
        }

        function sair() {
            localStorage.removeItem('usuario');
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
